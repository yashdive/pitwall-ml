# Processed layer (docs/design/processed_layer.md).
# Changing any rule below means a new version: bump `version` so the old data stays as it is.
version: v1

raw_uri: data/raw
processed_uri: data/processed
compression: zstd
sessions: [R]

rules:
  traffic_gap_s: 1.0              # in_traffic = gap to the car ahead below this
  restart_laps_after_sc_vsc: 3    # laps after a safety car / VSC that count as restart laps
  restart_laps_after_red_flag: 4  # laps after a red flag that count as restart laps
  max_track_temp_jump_c: 5.0      # bigger jump between weather readings = sensor error
  weather_before_start_s: 300     # use weather readings from this many seconds before the first lap
