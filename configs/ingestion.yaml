storage:
  raw_uri: data/raw
  cache_uri: data/cache/fastf1
  compression: zstd
  overwrite: false

backfill:
  # v1 models are trained on races only; add Q / FP2 / S here later.
  sessions: [R]
  # FastF1 allows 500 API calls/hour (~19 calls per race). With --wait-on-rate-limit
  # the backfill sleeps this long when the limit is hit, then resumes.
  rate_limit_wait_minutes: 61
