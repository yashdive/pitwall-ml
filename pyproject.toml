[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-intelligence"
version = "0.1.0"
description = "End-to-end ML system for F1 tyre degradation and race strategy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastf1>=3.8",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pydantic>=2.7",
    "pyyaml>=6",
    "pandera>=0.20",
]

[project.scripts]
f1-backfill = "f1_intelligence.ingestion.backfill:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: hits FastF1 (network or local cache); run with -m integration"]
addopts = "-m 'not integration'"
